name: CI

on:
  push:
    branches: master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Pull repository
        uses: actions/checkout@v4

      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Pull repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_IMAGE }}:${{ github.sha }}
            ${{ secrets.DOCKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/apps/ts-express-ci
            sed -i "s|DOCKER_IMAGE=.*|DOCKER_IMAGE=${{ secrets.DOCKER_IMAGE}}:${{ github.sha }}|" .env
            docker compose pull
            docker compose up -d --wait
            docker compose ps

  notify:
    needs: [test, build, deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send notification to Telegram channel
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            STATUS="✅ Deploy успешен"
            EMOJI="🚀"
          elif [ "${{ needs.build.result }}" == "failure" ]; then
            STATUS="❌ Build упал"
            EMOJI="🔥"
          elif [ "${{ needs.test.result }}" == "failure" ]; then
            STATUS="❌ Test упал"
            EMOJI="🔥"
          else
            STATUS="⚠️ Что-то пошло не так"
            EMOJI="⚠️"
          fi

          TEXT="$EMOJI $STATUS%0A"
          TEXT="${TEXT}📦 Репо: ${{ github.repository }}%0A"
          TEXT="${TEXT}🌿 Ветка: ${{ github.ref_name }}%0A"
          TEXT="${TEXT}👤 Автор: ${{ github.actor }}%0A"
          TEXT="${TEXT}🔗 [Лог](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TG_CHAT_ID }}" \
            -d "text=$TEXT" \
            -d "parse_mode=Markdown"
